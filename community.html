<!doctype html>
<html lang="ar" dir="rtl"><head>
<link rel="manifest" href="./manifest.webmanifest"><meta name="theme-color" content="#101116"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101116"><title>NOUN STAR | تصويت الجمهور</title>
<style>
:root{color-scheme:dark;--bg:#101116;--panel:#191c25;--blue:#172dc4;--line:#303544;--muted:#aeb5c5;--white:#fff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#17265b 0,transparent 38%),var(--bg);color:var(--white);font-family:system-ui,"Noto Sans Arabic",sans-serif;min-height:100vh}.wrap{width:min(760px,calc(100% - 28px));margin:0 auto;padding:28px 0 60px}.brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}.crest{width:58px;height:58px;border-radius:50%;background:#050505;border:2px solid white;display:grid;place-items:center;color:white;font-weight:900;box-shadow:-4px 0 #172dc4;font-size:15px}.brand small{display:block;color:var(--muted);letter-spacing:2px}.brand b{font-size:20px}.hero{padding:24px 0 18px}.hero h1{font-size:clamp(26px,6vw,40px);margin:0 0 8px}.hero p,.muted{color:var(--muted);line-height:1.8}.poll{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 12px 34px #0003}.poll h2{font-size:20px;margin:0 0 8px}.option{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0;cursor:pointer}.option input{accent-color:#536dff;width:18px;height:18px}.btn{border:0;border-radius:12px;background:var(--blue);color:white;padding:12px 18px;font-weight:700;cursor:pointer;width:100%;margin-top:10px}.btn:disabled{opacity:.5;cursor:not-allowed}.bar{height:8px;background:#303544;border-radius:10px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:#536dff}.result{margin:14px 0}.result-head{display:flex;justify-content:space-between;gap:12px}.notice{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}a{color:#9aabff}
</style></head><body><main class="wrap"><nav style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px"><a href="./" style="color:#c4d0ff;text-decoration:none;font-size:12px;font-weight:800">← الصفحة الرئيسية</a><a href="./#loyalFans" style="color:#c4d0ff;text-decoration:none;font-size:12px;font-weight:800">الجمهور الوفي</a></nav><header class="brand"><div class="crest"><img src="./assets/noun-star-logo.png" alt="NOUN STAR" style="width:100%;height:100%;object-fit:contain;border-radius:50%"></div><div><b>NOUN STAR</b><small>FORZA NOUN STAR · GUELMIM</small></div></header><section class="hero"><h1>صوتك يصنع الفرق</h1><p>تصفح التصويتات متاح للجميع، أما المشاركة فتتطلب حساب الجمهور الوفي. يحصل كل حساب على صوت واحد في كل تصويت.</p></section><div id="polls"><div class="notice">جارٍ تحميل التصويتات...</div></div><footer> Noun Star Football Club · Developing Future Champions<br>Guelmim | Morocco</footer></main>
<script>
(()=>{"use strict";
const URL="https://fatjyhoscjtwthbwiefo.supabase.co",KEY="sb_publishable_-2WmKjEZQe-Ap2UGymmuRg_OhlT5bMV";
const root=document.getElementById("polls"),headers={"apikey":KEY,"Content-Type":"application/json"};
function getSession(){try{return JSON.parse(localStorage.getItem("nsm_session")||"null")}catch{return null}}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function voterKey(id,userId){const k="nsm-public-vote-"+id+"-"+userId;let v=localStorage.getItem(k);if(!v){const b=new Uint8Array(24);crypto.getRandomValues(b);v=[...b].map(x=>x.toString(16).padStart(2,"0")).join("");localStorage.setItem(k,v)}return v}
async function api(path,options={}){const session=getSession();const r=await fetch(URL+"/rest/v1/"+path,{...options,headers:{...headers,Authorization:"Bearer "+(session?.access_token||KEY),...(options.headers||{})}});if(!r.ok)throw Error("HTTP "+r.status);return r.status===204?null:r.json()}
async function results(id){return api("rpc/nsm_public_poll_results",{method:"POST",body:JSON.stringify({p_poll_id:id})})}
async function render(){try{const polls=await api("audience_polls?select=id,title,description,ends_at&is_published=eq.true&starts_at=lte."+encodeURIComponent(new Date().toISOString())+"&ends_at=gt."+encodeURIComponent(new Date().toISOString())+"&order=ends_at.asc");
 let member=null;const activeSession=getSession();if(activeSession?.user?.id){try{const rows=await api("audience_members?select=user_id,display_name&user_id=eq."+encodeURIComponent(activeSession.user.id));member=rows[0]||null}catch{member=null}}if(!polls.length){root.innerHTML='<div class="notice">لا توجد تصويتات مفتوحة حالياً. تابعنا لاحقاً.</div>';return}root.innerHTML="";for(const p of polls){const opts=await api("audience_poll_options?select=id,label,sort_order&poll_id=eq."+p.id+"&order=sort_order.asc");let voted=false;if(member){try{const mine=await api("audience_poll_votes?select=id&poll_id=eq."+p.id+"&voter_user_id=eq."+encodeURIComponent(member.user_id));voted=mine.length>0}catch{voted=false}}const card=document.createElement("article");card.className="poll";card.innerHTML='<h2>'+esc(p.title)+'</h2><p class="muted">'+esc(p.description)+'</p><p class="muted">ينتهي: '+esc(new Date(p.ends_at).toLocaleString("ar-MA"))+'</p><form><div>'+opts.map((o,i)=>'<label class="option"><input type="radio" name="choice" value="'+esc(o.id)+'" '+(i===0?"":"")+' required><span>'+esc(o.label)+'</span></label>').join("")+'</div><button class="btn" '+(voted||!member?"disabled":"")+'>'+(voted?"تم تسجيل صوتك من حسابك":(!member?"سجّل الدخول بحساب الجمهور الوفي للتصويت":"صوّت الآن"))+'</button><p class="muted status" aria-live="polite"></p></form><div class="results"></div>';const form=card.querySelector("form");form.addEventListener("submit",async e=>{e.preventDefault();const choice=new FormData(form).get("choice");const btn=form.querySelector("button"),status=form.querySelector(".status");if(!choice)return;if(!member){status.innerHTML='التصويت متاح لأعضاء الجمهور الوفي فقط. <a href="./#loyalFans">أنشئ حساباً أو سجّل الدخول</a>.';return}btn.disabled=true;status.textContent="جارٍ تسجيل صوتك...";try{await api("audience_poll_votes",{method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({poll_id:p.id,option_id:choice,voter_key:voterKey(p.id,member.user_id),voter_user_id:member.user_id})});status.textContent="شكراً لك، تم تسجيل صوتك.";btn.textContent="تم تسجيل صوتك";const r=await results(p.id);showResults(card,r)}catch(err){status.textContent="لم نتمكن من تسجيل الصوت. ربما سبق التصويت من هذا المتصفح.";btn.disabled=false}});root.appendChild(card);const r=await results(p.id);showResults(card,r)}}catch(e){root.innerHTML='<div class="notice">تعذر تحميل التصويتات الآن. حاول تحديث الصفحة لاحقاً.</div>'}}
function showResults(card,rows){const total=rows.reduce((n,x)=>n+Number(x.vote_count||0),0);card.querySelector(".results").innerHTML='<h3>النتائج الحالية · '+total+' صوت</h3>'+rows.map(x=>{const n=Number(x.vote_count||0),pct=total?Math.round(n/total*100):0;return '<div class="result"><div class="result-head"><span>'+esc(x.label)+'</span><b>'+pct+'% ('+n+')</b></div><div class="bar"><i style="width:'+pct+'%"></i></div></div>'}).join("")}
render();
})();

if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(()=>{}))}
</script>

</body></html>
