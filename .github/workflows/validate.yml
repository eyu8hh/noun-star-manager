name: Validate app shell
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tools/validate.mjs"
      - "tools/browser-smoke.mjs"
      - ".github/workflows/validate.yml"
      - ".github/workflows/deploy-pages.yml"
      - "supabase/**"
      - "LICENSES/**"
      - "docs/**"
      - "README.md"
  pull_request:
    paths:
      - "index.html"
      - "tools/validate.mjs"
      - ".github/workflows/validate.yml"
      - ".github/workflows/deploy-pages.yml"
      - "supabase/**"
      - "LICENSES/**"
      - "docs/**"
      - "README.md"
jobs:
  validate:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/validate.mjs
      - name: Install Playwright browser test runtime
        run: |
          npm init -y
          npm install --no-save --package-lock=false playwright@1.56.1
      - name: Test real browser interactions with mocked Supabase
        run: node tools/browser-smoke.mjs
