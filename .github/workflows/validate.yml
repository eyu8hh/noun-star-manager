name: Validate app shell
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tools/validate.mjs"
      - ".github/workflows/validate.yml"
      - ".github/workflows/deploy-pages.yml"
      - "supabase/**"
      - "LICENSES/**"
      - "docs/**"
      - "README.md"
  pull_request:
    paths:
      - "index.html"
      - "tools/validate.mjs"
      - ".github/workflows/validate.yml"
      - ".github/workflows/deploy-pages.yml"
      - "supabase/**"
      - "LICENSES/**"
      - "docs/**"
      - "README.md"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/validate.mjs
